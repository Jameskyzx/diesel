name: CI

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # master 上的推送不取消，避免最新提交只剩被取消的检查；PR 运行可取消。
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read

jobs:
  quality:
    name: Lint, typecheck, app coverage, build
    if: github.event_name != 'schedule'
    outputs:
      portfolio-evidence-verified: ${{ steps.portfolio-evidence.outputs.verified }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # portfolio:verify resolves both the current public runtime commit
          # and the last fully documented release lineage.
          fetch-depth: 0

      - name: Reject install-time repository code
        env:
          BASH_ENV: /dev/null
          ENV: /dev/null
          LD_AUDIT: ""
          LD_LIBRARY_PATH: ""
          LD_PRELOAD: ""
          PYTHONHOME: ""
          PYTHONPATH: ""
        shell: /bin/bash --noprofile --norc -Eeuo pipefail {0}
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          /usr/bin/test -f scripts/ci/verify-install-boundary.py
          /usr/bin/test ! -L scripts/ci/verify-install-boundary.py
          /usr/bin/printf '%s  %s\n' 'c93b2710d56dcbc8b2bb20f5b156b8d66531f52099295e5f3632643beb43627b' 'scripts/ci/verify-install-boundary.py' | /usr/bin/sha256sum -c -
          /usr/bin/env -i PATH=/usr/bin:/bin /usr/bin/python3 -I -S scripts/ci/verify-install-boundary.py

      # pnpm/action-setup 从 package.json 的 packageManager 字段读取固定
      # 版本（pnpm@11.9.0），必须先于 setup-node，使 pnpm 缓存键与 store
      # 路径来自同一版本。
      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts --ignore-pnpmfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Application tests with coverage gate (PGlite)
        run: pnpm test:coverage:app

      - name: Verify portfolio evidence snapshot
        id: portfolio-evidence
        env:
          BASH_ENV: /dev/null
          ENV: /dev/null
          LD_AUDIT: ""
          LD_LIBRARY_PATH: ""
          LD_PRELOAD: ""
          NODE_OPTIONS: ""
          NODE_PATH: ""
          PORTFOLIO_EXPECTED_HEAD_SHA: ${{ github.sha }}
          PORTFOLIO_TRUSTED_GIT: /usr/bin/git
        shell: /bin/bash --noprofile --norc -Eeuo pipefail {0}
        working-directory: ${{ github.workspace }}
        run: ${{ runner.tool_cache }}/node/22.22.3/x64/bin/node --conditions=react-server --import tsx scripts/portfolio/verify.ts --release-evidence

      - name: Drizzle migration check
        run: pnpm db:check

      - name: Build
        run: pnpm build

      - name: Upload coverage report
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14
          if-no-files-found: warn

  deploy-contracts:
    name: Linux deployment script contracts
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Preserve the full-history contract that this suite had while it
          # ran inside quality.
          fetch-depth: 0

      - name: Reject install-time repository code
        env:
          BASH_ENV: /dev/null
          ENV: /dev/null
          LD_AUDIT: ""
          LD_LIBRARY_PATH: ""
          LD_PRELOAD: ""
          PYTHONHOME: ""
          PYTHONPATH: ""
        shell: /bin/bash --noprofile --norc -Eeuo pipefail {0}
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          /usr/bin/test -f scripts/ci/verify-install-boundary.py
          /usr/bin/test ! -L scripts/ci/verify-install-boundary.py
          /usr/bin/printf '%s  %s\n' 'c93b2710d56dcbc8b2bb20f5b156b8d66531f52099295e5f3632643beb43627b' 'scripts/ci/verify-install-boundary.py' | /usr/bin/sha256sum -c -
          /usr/bin/env -i PATH=/usr/bin:/bin /usr/bin/python3 -I -S scripts/ci/verify-install-boundary.py

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts --ignore-pnpmfile

      - name: Run deployment script contracts
        run: pnpm test:deploy:contracts

      - name: Exercise never-activated archival on Linux
        run: pnpm exec vitest run tests/unarmed-release-archive.test.ts

  postgres-migrations:
    name: PostgreSQL + pgvector migration smoke
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b # pg16
        env:
          POSTGRES_DB: diesel_ci
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d diesel_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/diesel_ci
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Reject install-time repository code
        env:
          BASH_ENV: /dev/null
          ENV: /dev/null
          LD_AUDIT: ""
          LD_LIBRARY_PATH: ""
          LD_PRELOAD: ""
          PYTHONHOME: ""
          PYTHONPATH: ""
        shell: /bin/bash --noprofile --norc -Eeuo pipefail {0}
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          /usr/bin/test -f scripts/ci/verify-install-boundary.py
          /usr/bin/test ! -L scripts/ci/verify-install-boundary.py
          /usr/bin/printf '%s  %s\n' 'c93b2710d56dcbc8b2bb20f5b156b8d66531f52099295e5f3632643beb43627b' 'scripts/ci/verify-install-boundary.py' | /usr/bin/sha256sum -c -
          /usr/bin/env -i PATH=/usr/bin:/bin /usr/bin/python3 -I -S scripts/ci/verify-install-boundary.py

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts --ignore-pnpmfile

      - name: Migrate an empty PostgreSQL database
        run: pnpm exec tsx scripts/db/migrate.ts

      - name: Verify pgvector and final schema state
        run: pnpm db:smoke:postgres

      - name: Verify country detail repeatable-read snapshot
        env:
          DATABASE_MODE: postgres
          DIESEL_POSTGRES_CONCURRENCY_SMOKE: "1"
          NODE_ENV: production
        run: pnpm db:smoke:country-detail-consistency

      - name: Verify governance PostgreSQL concurrency
        env:
          DATABASE_MODE: postgres
          DIESEL_POSTGRES_CONCURRENCY_SMOKE: "1"
          NODE_ENV: production
        run: pnpm db:smoke:governance-concurrency

      - name: Verify AI chat rate-limit PostgreSQL concurrency
        env:
          DATABASE_MODE: postgres
          DIESEL_POSTGRES_CONCURRENCY_SMOKE: "1"
          NODE_ENV: production
        run: pnpm db:smoke:rate-limit-concurrency

      - name: Verify 0010 to 0011 dirty-data fail-closed upgrade
        run: pnpm db:smoke:upgrade

  e2e:
    name: Playwright key flows
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Reject install-time repository code
        env:
          BASH_ENV: /dev/null
          ENV: /dev/null
          LD_AUDIT: ""
          LD_LIBRARY_PATH: ""
          LD_PRELOAD: ""
          PYTHONHOME: ""
          PYTHONPATH: ""
        shell: /bin/bash --noprofile --norc -Eeuo pipefail {0}
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          /usr/bin/test -f scripts/ci/verify-install-boundary.py
          /usr/bin/test ! -L scripts/ci/verify-install-boundary.py
          /usr/bin/printf '%s  %s\n' 'c93b2710d56dcbc8b2bb20f5b156b8d66531f52099295e5f3632643beb43627b' 'scripts/ci/verify-install-boundary.py' | /usr/bin/sha256sum -c -
          /usr/bin/env -i PATH=/usr/bin:/bin /usr/bin/python3 -I -S scripts/ci/verify-install-boundary.py

      # pnpm/action-setup 从 package.json 的 packageManager 字段读取固定
      # 版本（pnpm@11.9.0），必须先于 setup-node，使 pnpm 缓存键与 store
      # 路径来自同一版本。
      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts --ignore-pnpmfile

      - name: Install Playwright Chromium and WebKit
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Run Playwright tests
        env:
          DIESEL_PLAYWRIGHT_EVIDENCE_CAPTURE: "1"
        run: pnpm test:e2e

      - name: Build the production application for the CSP contract
        run: pnpm build

      - name: Run the production CSP contract
        env:
          DIESEL_PLAYWRIGHT_EVIDENCE_CAPTURE: "1"
        run: pnpm test:e2e:csp:production

      - name: Verify public and production CSP Playwright receipts
        env:
          BASH_ENV: /dev/null
          ENV: /dev/null
          LD_AUDIT: ""
          LD_LIBRARY_PATH: ""
          LD_PRELOAD: ""
          NODE_OPTIONS: ""
          NODE_PATH: ""
        shell: /bin/bash --noprofile --norc -Eeuo pipefail {0}
        working-directory: ${{ github.workspace }}
        run: pnpm portfolio:verify-playwright-runs -- public production-csp

      - name: Upload public Playwright receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-public-receipt
          path: test-results/public/playwright-run.json
          retention-days: 14
          if-no-files-found: warn

      - name: Upload production CSP Playwright receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-production-csp-receipt
          path: test-results/production-csp/playwright-run.json
          retention-days: 14
          if-no-files-found: warn

      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
          if-no-files-found: warn

      - name: Upload Playwright traces and screenshots
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 14
          if-no-files-found: warn

  portfolio-demo-e2e:
    name: Portfolio demo via pnpm demo
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Reject install-time repository code
        env:
          BASH_ENV: /dev/null
