name: Production canary

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
    inputs:
      include_ai:
        description: Run the paid AI SSE contract check
        default: false
        required: true
        type: boolean

concurrency:
  group: production-canary
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  canary:
    name: Public production contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install locked canary runtime
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Check public production contracts
        env:
          CANARY_BASE_URL: https://jamesky.site
          CANARY_CHECK_AI: ${{ github.event_name == 'workflow_dispatch' && inputs.include_ai && 'true' || 'false' }}
          CANARY_REPORT_PATH: artifacts/production-canary.json
          CANARY_STATUS_PATH: docs/STATUS.md
          CANARY_TIMEOUT_MS: "30000"
        run: pnpm ops:canary

      - name: Upload sanitized canary report
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: production-canary-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/production-canary.json
          retention-days: 14
          if-no-files-found: error
