limit_conn_zone $binary_remote_addr zone=chat_per_client:10m;
limit_conn_zone $server_name zone=chat_global:1m;

server {
    listen 80;
    listen [::]:80;
    server_name jamesky.site www.jamesky.site;

    return 301 https://jamesky.site$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name jamesky.site www.jamesky.site;

    ssl_certificate /etc/letsencrypt/live/jamesky.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jamesky.site/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location = /admin {
        return 404;
    }

    location ^~ /admin/ {
        return 404;
    }

    location ^~ /api/admin/ {
        return 404;
    }

    location ^~ /dev/ {
        return 404;
    }

    location ^~ /api/dev/ {
        return 404;
    }

    # Only the multimodal chat endpoint needs the larger request ceiling.
    # Stream request bodies upstream instead of first persisting them in an
    # Nginx client-body temporary file.
    location = /api/chat {
        # Keep the proxy ceiling just above the application's 9 MiB streamed
        # chat-body limit so valid base64 attachments reach structured
        # validation while the application remains the authoritative gate.
        client_max_body_size 10m;
        client_body_timeout 30s;
        proxy_request_buffering off;
        limit_conn_status 429;
        limit_conn chat_per_client 3;
        limit_conn chat_global 8;
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Public origin terminates the trusted proxy chain here. Do not append
        # a client-supplied X-Forwarded-For value or per-client rate limits can
        # be bypassed by spoofing the first address.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_set_header oai-authenticated-user-email "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
    }

    location / {
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_set_header oai-authenticated-user-email "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
    }
}
