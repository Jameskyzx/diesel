          if-no-files-found: warn

      - name: Upload portfolio demo report
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-demo-report
          path: playwright-demo-report/
          retention-days: 14
          if-no-files-found: warn

      - name: Upload Playwright traces and screenshots
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-demo-test-results
          path: test-results/
          retention-days: 14
          if-no-files-found: warn

  fde-demo-e2e:
    name: Failure-first FDE workflow via pnpm demo:fde
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Reject install-time repository code
        env:
          BASH_ENV: /dev/null
          ENV: /dev/null
          LD_AUDIT: ""
          LD_LIBRARY_PATH: ""
          LD_PRELOAD: ""
          PYTHONHOME: ""
          PYTHONPATH: ""
        shell: /bin/bash --noprofile --norc -Eeuo pipefail {0}
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          /usr/bin/test -f scripts/ci/verify-install-boundary.py
          /usr/bin/test ! -L scripts/ci/verify-install-boundary.py
          /usr/bin/printf '%s  %s\n' 'c93b2710d56dcbc8b2bb20f5b156b8d66531f52099295e5f3632643beb43627b' 'scripts/ci/verify-install-boundary.py' | /usr/bin/sha256sum -c -
          /usr/bin/env -i PATH=/usr/bin:/bin /usr/bin/python3 -I -S scripts/ci/verify-install-boundary.py

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts --ignore-pnpmfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run the failure-first FDE workflow
        env:
          DIESEL_PLAYWRIGHT_EVIDENCE_CAPTURE: "1"
        run: pnpm test:e2e:fde

      - name: Verify failure-first FDE Playwright receipt
        env:
          BASH_ENV: /dev/null
          ENV: /dev/null
          LD_AUDIT: ""
          LD_LIBRARY_PATH: ""
          LD_PRELOAD: ""
          NODE_OPTIONS: ""
          NODE_PATH: ""
        shell: /bin/bash --noprofile --norc -Eeuo pipefail {0}
        working-directory: ${{ github.workspace }}
