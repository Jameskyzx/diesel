# Gitleaks 配置（M2 密钥扫描基线）。
# CI 中由 .github/workflows/ci.yml 的 secrets job 使用固定版本二进制运行；
# 本地可用 `gitleaks detect --source . --config .gitleaks.toml --redact` 自检。

[extend]
# 使用 gitleaks 内置默认规则集，再叠加项目允许清单。
useDefault = true

[allowlist]
description = "仅允许公开环境模板中的精确占位值；不跳过任何整文件"
regexTarget = "line"
regexes = [
  '''^AI_API_KEY=replace-with-server-side-secret$''',
]
