version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "03:45"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    # Runtime is deliberately pinned to Node 22; types must describe that API.
    # Reconsider this exception together with the .nvmrc/VPS runtime migration.
    ignore:
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
      # Same-origin worker assets and bundled-license notices are pinned to one
      # reviewed MapLibre build (scripts/maplibre-worker-assets.ts). 6.14.0
      # ships no shared-chunk source map, so upgrades are a deliberate task.
      - dependency-name: "maplibre-gl"
      # These carry pnpm patches tied to one exact version (patchedDependencies
      # in pnpm-workspace.yaml); vitest and eslint-config-next pin the patched
      # @vitest/runner and @next/eslint-plugin-next. Dependabot cannot move a
      # patch, so a bump fails the whole group. Upgrade them with the patch.
      - dependency-name: "next"
      - dependency-name: "postgres"
      - dependency-name: "vaul"
      - dependency-name: "vitest"
      - dependency-name: "eslint-config-next"
    groups:
      production-dependencies:
        dependency-type: production
        update-types: [minor, patch]
      development-dependencies:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:15"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
