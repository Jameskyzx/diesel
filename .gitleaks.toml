# Gitleaks 配置（M2 密钥扫描基线）。
# CI 中由 .github/workflows/ci.yml 的 secrets job 使用固定版本二进制运行；
# 本地可用 `gitleaks detect --source . --config .gitleaks.toml --redact` 自检。

[extend]
# 使用 gitleaks 内置默认规则集，再叠加项目允许清单。
useDefault = true

[allowlist]
description = "仅允许环境模板占位值和固定测试 UUID 的精确行；不跳过任何整文件"
regexTarget = "line"
regexes = [
  '''^AI_API_KEY=replace-with-server-side-secret$''',
  # Public deterministic lock/receipt fixtures, never service credentials.
  '''^\s*const (staleToken|OWNER_TOKEN|token) = "123e4567-e89b-42d3-a456-42661417400[012]";$''',
  '''^\s*(token: |receipt\.token = )"123e4567-e89b-42d3-a456-426614174000"[,;]$''',
  '''^\s*'  "token": "123e4567-e89b-42d3-a456-426614174000",\\n' \+$''',
]
