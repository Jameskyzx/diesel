name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # master 上的推送不取消，避免最新提交只剩被取消的检查；PR 运行可取消。
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read

jobs:
  quality:
    name: Lint, typecheck, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # pnpm/action-setup 从 package.json 的 packageManager 字段读取固定
      # 版本（pnpm@11.9.0），必须先于 setup-node，使 pnpm 缓存键与 store
      # 路径来自同一版本。
      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit and integration tests (PGlite)
        run: pnpm test

      - name: Drizzle migration check
        run: pnpm db:check

      - name: Build
        run: pnpm build

  e2e:
    name: Playwright key flows
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # pnpm/action-setup 从 package.json 的 packageManager 字段读取固定
      # 版本（pnpm@11.9.0），必须先于 setup-node，使 pnpm 缓存键与 store
      # 路径来自同一版本。
      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
          if-no-files-found: warn

      - name: Upload Playwright traces and screenshots
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 14
          if-no-files-found: warn

  secrets:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        env:
          GITLEAKS_VERSION: 8.21.2
          GITLEAKS_SHA256: 5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          gh release download "v${GITLEAKS_VERSION}" --repo gitleaks/gitleaks --pattern "${archive}"
          test -s "${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "${archive}" gitleaks
          ./gitleaks detect --source . --config .gitleaks.toml --redact --verbose --exit-code 1

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # pnpm/action-setup 从 package.json 的 packageManager 字段读取固定
      # 版本（pnpm@11.9.0），必须先于 setup-node，使 pnpm 缓存键与 store
      # 路径来自同一版本。
      - name: Install pnpm
        uses: pnpm/action-setup@v4

      # 该 job 不执行安装（pnpm audit 直接读锁文件），因此不启用
      # setup-node 的 pnpm 缓存（store 路径不存在会导致缓存保存失败）。
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # 门禁级别为 critical；README「已知依赖风险」记录了当前来自 next /
      # eslint / drizzle-kit 构建工具链的 high 级公告，等待上游修复。
      - name: Audit dependencies (critical gate)
        run: pnpm audit --audit-level=critical

      - name: Show known advisories (informational)
        if: ${{ always() }}
        run: pnpm audit --audit-level=moderate || true
