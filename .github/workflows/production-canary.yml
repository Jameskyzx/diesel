name: Production canary

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
    inputs:
      include_ai:
        description: Run the paid AI SSE contract check
        default: true
        required: true
        type: boolean

concurrency:
  group: production-canary
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  canary:
    name: Public production contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install locked canary runtime
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Check public production contracts
        env:
          CANARY_BASE_URL: https://diesel.jamesky.site
          # One real starter, at most five provider steps, four scheduled runs/day.
          # No automatic retry; paid failures remain failures in the saved report.
          CANARY_CHECK_AI: ${{ github.event_name == 'schedule' || inputs.include_ai == true }}
          # Production may already run this checked-out commit before its
          # STATUS.md record merges; the canary accepts either exact SHA.
          CANARY_MASTER_VERSION: ${{ github.sha }}
          CANARY_REPORT_PATH: artifacts/production-canary.json
          CANARY_STATUS_PATH: docs/STATUS.md
          CANARY_TIMEOUT_MS: "45000"
        run: pnpm ops:canary

      - name: Upload sanitized canary report
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: production-canary-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/production-canary.json
          # Keep the full 28-day observation window plus seven days for review.
          retention-days: 35
          if-no-files-found: error
