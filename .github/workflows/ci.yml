      - name: Upload FDE Playwright traces and screenshots
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-fde-test-results
          path: test-results/
          retention-days: 14
          if-no-files-found: warn

  secrets:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Run gitleaks
        env:
          GITLEAKS_VERSION: 8.21.2
          GITLEAKS_SHA256: 5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          gh release download "v${GITLEAKS_VERSION}" --repo gitleaks/gitleaks --pattern "${archive}"
          test -s "${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "${archive}" gitleaks
          /usr/bin/test -f scripts/ci/run-gitleaks.py
          /usr/bin/test ! -L scripts/ci/run-gitleaks.py
          /usr/bin/printf '%s  %s\n' '4619f93ccc00c792171a51db1081f1c3247a0aff7db10e78b25717f738c385a0' 'scripts/ci/run-gitleaks.py' | /usr/bin/sha256sum -c -
          /usr/bin/env -i PATH=/usr/bin:/bin /usr/bin/python3 -I -S scripts/ci/run-gitleaks.py ./gitleaks

  audit:
    name: Dependency and workflow supply-chain audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Reject install-time repository code
        env:
          BASH_ENV: /dev/null
          ENV: /dev/null
          LD_AUDIT: ""
          LD_LIBRARY_PATH: ""
          LD_PRELOAD: ""
          PYTHONHOME: ""
          PYTHONPATH: ""
        shell: /bin/bash --noprofile --norc -Eeuo pipefail {0}
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          /usr/bin/test -f scripts/ci/verify-install-boundary.py
          /usr/bin/test ! -L scripts/ci/verify-install-boundary.py
          /usr/bin/printf '%s  %s\n' 'c93b2710d56dcbc8b2bb20f5b156b8d66531f52099295e5f3632643beb43627b' 'scripts/ci/verify-install-boundary.py' | /usr/bin/sha256sum -c -
          /usr/bin/env -i PATH=/usr/bin:/bin /usr/bin/python3 -I -S scripts/ci/verify-install-boundary.py

      # pnpm/action-setup 从 package.json 的 packageManager 字段读取固定
      # 版本（pnpm@11.9.0），必须先于 setup-node，使 pnpm 缓存键与 store
      # 路径来自同一版本。
      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      # 该 job 只安装执行 TypeScript 策略所需的锁定依赖，不运行生命周期脚本；
      # 不启用 setup-node 缓存，避免独立 scheduled job 的 store 保存噪声。
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc

      - name: Install audit policy runtime
        run: pnpm install --frozen-lockfile --ignore-scripts --ignore-pnpmfile

      - name: Enforce immutable GitHub Action references
        run: pnpm audit:actions

      # 门禁与 high 级限时处置规则见 docs/DEPENDENCY_SECURITY.md。
      - name: Enforce dependency advisory policy
        run: pnpm audit:security

  linux-release-handoff:
    name: Linux release handoff (systemd cgroup + real build)
    if: github.event_name != 'schedule'
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout the complete release commit without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Reject install-time repository code
        env:
          BASH_ENV: /dev/null
          ENV: /dev/null
          LD_AUDIT: ""
          LD_LIBRARY_PATH: ""
          LD_PRELOAD: ""
          PYTHONHOME: ""
          PYTHONPATH: ""
        shell: /bin/bash --noprofile --norc -Eeuo pipefail {0}
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          /usr/bin/test -f scripts/ci/verify-install-boundary.py
          /usr/bin/test ! -L scripts/ci/verify-install-boundary.py
          /usr/bin/printf '%s  %s\n' 'c93b2710d56dcbc8b2bb20f5b156b8d66531f52099295e5f3632643beb43627b' 'scripts/ci/verify-install-boundary.py' | /usr/bin/sha256sum -c -
          /usr/bin/env -i PATH=/usr/bin:/bin /usr/bin/python3 -I -S scripts/ci/verify-install-boundary.py

      # Do not install pnpm through an action here. The release handoff must use
      # the same Corepack path as production, with its cache isolated under the
      # temporary diesel-build HOME.
      - name: Setup the production Node.js version
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc

      - name: Exercise the root-to-builder-to-runtime handoff
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${RUNNER_ENVIRONMENT}" = "github-hosted"
          sudo -n true
          # Keep both synthetic users independent of runner-home permissions.
          # This exact generated tree is left to ephemeral runner teardown.
          handoff_temp="$(mktemp -d /tmp/diesel-handoff-runner.XXXXXX)"
          chmod 0755 "${handoff_temp}"
          test "$(realpath -- "${handoff_temp}")" = "${handoff_temp}"
          release_id="$(git rev-parse --verify 'HEAD^{commit}')"
          [[ "${release_id}" =~ ^[0-9a-f]{40}$ ]]
          test -z "$(git status --porcelain --untracked-files=no)"
          export_parent="$(mktemp -d "${handoff_temp}/diesel-release-export.XXXXXX")"
          release_export="${export_parent}/release"
          release_archive="${export_parent}/release.tar"
          install -d -m 0755 "${release_export}"
          git archive --format=tar --output="${release_archive}" "${release_id}"
          tar -xf "${release_archive}" -C "${release_export}"
          node scripts/deploy/release-input-manifest.mjs \
            create "${release_id}" "${release_export}/.release-input-manifest.json"
          node_binary="$(realpath -- "$(command -v node)")"
          node_directory="$(dirname -- "${node_binary}")"
          test -x "${release_export}/scripts/ci/linux-release-handoff-smoke.sh"
          sudo -n /usr/bin/env -i \
            CI=true \
            GITHUB_ACTIONS=true \
            RUNNER_ENVIRONMENT="${RUNNER_ENVIRONMENT}" \
            PATH="${node_directory}:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" \
            /bin/bash "${release_export}/scripts/ci/linux-release-handoff-smoke.sh" \
            "${release_id}" "${release_export}" "${node_binary}" "${handoff_temp}"

  required:
    name: Required CI gate
    if: ${{ always() && github.event_name != 'schedule' }}
    needs:
      - quality
      - deploy-contracts
      - postgres-migrations
      - e2e
      - fde-demo-e2e
      - portfolio-demo-e2e
      - secrets
      - audit
      - linux-release-handoff
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every merge-blocking job to succeed
        env:
          AUDIT_RESULT: ${{ needs.audit.result }}
          BASH_ENV: /dev/null
          DEMO_RESULT: ${{ needs.portfolio-demo-e2e.result }}
          DEPLOY_CONTRACTS_RESULT: ${{ needs['deploy-contracts'].result }}
          ENV: /dev/null
          E2E_RESULT: ${{ needs.e2e.result }}
          FDE_DEMO_RESULT: ${{ needs.fde-demo-e2e.result }}
          LD_AUDIT: ""
          LD_LIBRARY_PATH: ""
          LD_PRELOAD: ""
          LINUX_RELEASE_HANDOFF_RESULT: ${{ needs['linux-release-handoff'].result }}
          POSTGRES_RESULT: ${{ needs.postgres-migrations.result }}
          QUALITY_EVIDENCE_VERIFIED: ${{ needs.quality.outputs.portfolio-evidence-verified }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          SECRETS_RESULT: ${{ needs.secrets.result }}
        shell: /bin/bash --noprofile --norc -Eeuo pipefail {0}
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          /usr/bin/test "${QUALITY_RESULT}" = "success" || exit 1
          /usr/bin/test "${QUALITY_EVIDENCE_VERIFIED}" = "true" || exit 1
          /usr/bin/test "${DEPLOY_CONTRACTS_RESULT}" = "success" || exit 1
          /usr/bin/test "${POSTGRES_RESULT}" = "success" || exit 1
          /usr/bin/test "${E2E_RESULT}" = "success" || exit 1
          /usr/bin/test "${DEMO_RESULT}" = "success" || exit 1
          /usr/bin/test "${FDE_DEMO_RESULT}" = "success" || exit 1
          /usr/bin/test "${SECRETS_RESULT}" = "success" || exit 1
          /usr/bin/test "${AUDIT_RESULT}" = "success" || exit 1
          /usr/bin/test "${LINUX_RELEASE_HANDOFF_RESULT}" = "success" || exit 1
